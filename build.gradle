plugins {
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.107'
}

version = '0.1.0'
group = 'com.qln.currency_motor'
base { archivesName = 'currency-motor-forge-1.20.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = '1.20.1-47.4.20'
    validateAccessTransformers = false

    parchment {
        minecraftVersion = '1.20.1'
        mappingsVersion = '2023.09.03'
    }

    mods {
        currency_motor {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            gameDirectory = project.file('run/server')
        }
        configureEach {
            systemProperty('forge.logging.markers', 'REGISTRIES')
            systemProperty('forge.logging.console.level', 'debug')
        }
    }
}

repositories {
    maven { name = 'Create'; url = 'https://maven.createmod.net' }
    maven { name = 'Registrate'; url = 'https://maven.ithundxr.dev/mirror' }
    mavenCentral()
}

dependencies {
    modCompileOnly('com.simibubi.create:create-1.20.1:6.0.8-291:all')
    modRuntimeOnly('com.simibubi.create:create-1.20.1:6.0.8-291:all')
    modCompileOnly('com.tterrag.registrate:Registrate:MC1.20-1.3.3')
    modRuntimeOnly('com.tterrag.registrate:Registrate:MC1.20-1.3.3')
    modCompileOnly('dev.engine-room.flywheel:flywheel-forge-api-1.20.1:1.0.6-beta-266')
    modRuntimeOnly('dev.engine-room.flywheel:flywheel-forge-1.20.1:1.0.6-beta-266')
    modCompileOnly('net.createmod.ponder:Ponder-Forge-1.20.1:1.0.91')
    modRuntimeOnly('net.createmod.ponder:Ponder-Forge-1.20.1:1.0.91')
    modRuntimeOnly('dev.engine-room.vanillin:vanillin-forge-1.20.1:1.0.0')
}

tasks.named('processResources').configure {
    def replaceProperties = [
            version: project.version
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') { expand replaceProperties }
}

jar {
    archiveFileName = "currency-motor-forge-1.20.1-" + project.version + ".jar"
    manifest {
        attributes([
                'Specification-Title'     : 'currency_motor',
                'Specification-Vendor'    : 'QLN',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'QLN',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) { artifact jar }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
