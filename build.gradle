plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '0.1.0'
group = 'com.qln.currency_motor'
base { archivesName = 'currency-motor-neoforge-1.21.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.248'

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            gameDirectory = project.file('run/server')
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        currency_motor {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { name = 'Create'; url = 'https://maven.createmod.net' }
    maven { name = 'Registrate'; url = 'https://maven.ithundxr.dev/mirror' }
    mavenCentral()
}

dependencies {
    compileOnly('com.simibubi.create:create-1.21.1:6.0.11-312') { transitive = false }
    runtimeOnly('com.simibubi.create:create-1.21.1:6.0.11-312') { transitive = false }
    compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6'
    runtimeOnly 'dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6'
    compileOnly 'net.createmod.ponder:ponder-neoforge:1.0.85+mc1.21.1'
    runtimeOnly 'net.createmod.ponder:ponder-neoforge:1.0.85+mc1.21.1'
    runtimeOnly 'dev.engine-room.vanillin:vanillin-neoforge-1.21.1:1.1.3-41'
}

tasks.named('processResources').configure {
    def replaceProperties = [
            minecraft_version: '1.21.1',
            neo_version: '21.1.248',
            mod_id: 'currency_motor',
            mod_name: 'Currency Motor',
            mod_license: 'MIT',
            mod_version: project.version,
            mod_authors: 'QLN'
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') { expand replaceProperties }
}

jar {
    archiveFileName = "currency-motor-neoforge-1.21.1-" + project.version + ".jar"
    manifest {
        attributes([
                'Specification-Title'     : 'currency_motor',
                'Specification-Vendor'    : 'QLN',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'QLN',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) { from components.java }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
